<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>司马光砸缸 · 短视频动画（含语音旁白/导出）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #1b1f2a;
    display: flex; align-items: center; justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  #wrap { position: relative; }
  #cv {
    display: block; height: 86vh; width: auto; max-width: 96vw;
    background: #cfeafd; border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .cap {
    position: absolute; left: 4%; right: 4%; color: #fff; text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,.85); pointer-events: none;
  }
  #narration { top: 12%; font-size: clamp(13px,2.4vh,20px); font-weight: 600;
    letter-spacing: .5px; background: rgba(20,30,50,.55); padding: 8px 12px; border-radius: 10px; }
  #subtitle { bottom: 9%; font-size: clamp(15px,3vh,24px); font-weight: 700;
    background: rgba(0,0,0,.6); padding: 10px 14px; border-radius: 12px; }
  #bar {
    position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 5;
  }
  #bar button {
    font: inherit; font-size: 13px; color: #fff; cursor: pointer;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.3);
    padding: 6px 10px; border-radius: 8px;
  }
  #bar button:hover { background: rgba(0,0,0,.8); }
  #status {
    position: absolute; top: 5px; right: 5px; color: #ffd; font-size: 12px;
    background: rgba(0,0,0,.5); padding: 4px 8px; border-radius: 6px; opacity: 0; transition: opacity .4s;
  }
  #hint {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: rgba(255,255,255,.8); font-size: 13px; background: rgba(0,0,0,.45);
    padding: 6px 10px; border-radius: 8px; pointer-events: none; transition: opacity .6s;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="360" height="640"></canvas>
  <div id="bar">
    <button id="btnNar">🔊 语音旁白</button>
    <button id="btnExp">⏺ 导出视频(一圈)</button>
  </div>
  <div id="status"></div>
  <div id="narration" class="cap"></div>
  <div id="subtitle" class="cap"></div>
  <div id="hint">自动循环播放中 · 点击「语音旁白」可听配音</div>
</div>

<script>
(() => {
  "use strict";
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const narrationEl = document.getElementById("narration");
  const subtitleEl = document.getElementById("subtitle");
  const hintEl = document.getElementById("hint");
  const statusEl = document.getElementById("status");
  const W = 360, H = 640;

  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.closePath(); }

  const DURATION = 28;
  const phases = [
    { s: 0,  e: 5,  nar: "庭院里，几个孩童正在追逐嬉戏。",       sub: "（孩童嬉戏）" },
    { s: 5,  e: 9,  nar: "一个孩童攀爬水缸，不慎失足落水！",     sub: "扑通——有人落水了！" },
    { s: 9,  e: 13, nar: "同伴们惊慌失措，纷纷呼救。",           sub: "救命啊！快来人啊！" },
    { s: 13, e: 19, nar: "司马光临危不乱，举起石头砸向水缸。",   sub: "看我的！" },
    { s: 19, e: 24, nar: "水缸破裂，水流涌出，落水孩童脱险。",   sub: "哗——水流出来了！" },
    { s: 24, e: 28, nar: "众人称赞司马光机智勇敢。",             sub: "司马光真聪明！" },
  ];
  function phaseIndexAt(t) {
    for (let i = 0; i < phases.length; i++) if (t >= phases[i].s && t < phases[i].e) return i;
    return phases.length - 1;
  }

  const VAT = { cx: 180, top: 300, w: 150, h: 185 };
  function waterSurfaceY(level) { return VAT.top + VAT.h * (1 - level) * 0.82 + 18; }

  const particles = [];
  function spawnSplash(x, y, n, color) {
    for (let i = 0; i < n; i++) particles.push({
      x, y, vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 4 - 1, life: 1, color: color || "#bfe9ff",
    });
  }
  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life -= 0.025;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawKid(x, y, color, armUp, bob) {
    const yy = y + (bob ? Math.sin(performance.now() / 140) * 2.5 : 0);
    ctx.strokeStyle = "#3a2a1a"; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x - 5, yy - 16); ctx.lineTo(x - 5, yy);
    ctx.moveTo(x + 5, yy - 16); ctx.lineTo(x + 5, yy); ctx.stroke();
    ctx.fillStyle = color; rr(x - 11, yy - 46, 22, 30, 7); ctx.fill();
    ctx.fillStyle = "#ffd9a0"; circle(x, yy - 56, 11); ctx.fill();
    ctx.fillStyle = "#3a2a1a"; circle(x - 4, yy - 57, 1.6); circle(x + 4, yy - 57, 1.6);
    ctx.strokeStyle = color; ctx.lineWidth = 5;
    if (armUp) { ctx.beginPath(); ctx.moveTo(x - 9, yy - 42); ctx.lineTo(x - 19, yy - 60);
      ctx.moveTo(x + 9, yy - 42); ctx.lineTo(x + 19, yy - 60); ctx.stroke(); }
    else { ctx.beginPath(); ctx.moveTo(x - 9, yy - 42); ctx.lineTo(x - 18, yy - 30);
      ctx.moveTo(x + 9, yy - 42); ctx.lineTo(x + 18, yy - 30); ctx.stroke(); }
  }

  let waterLevel = 0.85, crack = false, stone = null, simaArmUp = false;
  const kidA = { x: 130, y: 560, label: false };

  function updateState(t) {
    if (t >= 19 && t < 24) waterLevel = lerp(0.85, 0.08, easeOut((t - 19) / 5));
    else if (t >= 24) waterLevel = 0.08; else waterLevel = 0.85;

    crack = (t >= 16); stone = null; simaArmUp = false;
    if (t >= 13 && t < 19) {
      const p = (t - 13) / 6;
      if (p < 0.5) { const q = p / 0.5; stone = { x: lerp(300, VAT.cx, easeOut(q)), y: lerp(520, VAT.top + 40, easeOut(q)) - Math.sin(q * Math.PI) * 40 }; simaArmUp = true; }
      else stone = { x: VAT.cx + 6, y: VAT.top + 40 };
    }

    kidA.label = (t >= 5);
    if (t < 5) { kidA.x = 130; kidA.y = 560; }
    else if (t < 9) { const p = (t - 5) / 4;
      if (p < 0.5) { const q = p / 0.5; kidA.x = lerp(130, VAT.cx, q); kidA.y = lerp(560, VAT.top, q); }
      else { const q = (p - 0.5) / 0.5; kidA.x = VAT.cx; kidA.y = lerp(VAT.top, VAT.top + 95, q); } }
    else if (t < 19) { kidA.x = VAT.cx; kidA.y = VAT.top + 95; }
    else if (t < 24) { const p = (t - 19) / 5; kidA.x = VAT.cx; kidA.y = lerp(VAT.top + 95, VAT.top + 10, easeOut(p)); }
    else { kidA.x = VAT.cx - 30; kidA.y = 560; }

    if (t >= 5 && t < 9 && Math.random() < 0.4) spawnSplash(VAT.cx, VAT.top + 20, 2);
    if (t >= 16 && t < 24 && Math.random() < 0.5) spawnSplash(VAT.cx, VAT.top + 30, 3);
  }

  function render(t) {
    const idx = phaseIndexAt(t);
    const phase = phases[idx];

    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#cfeafd"); sky.addColorStop(1, "#eafaf0");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#cdbf95"; ctx.fillRect(0, 500, W, H - 500);
    ctx.fillStyle = "#b9a877"; for (let i = 0; i < W; i += 24) ctx.fillRect(i, 500, 12, 6);

    const surfaceY = waterSurfaceY(waterLevel);
    ctx.fillStyle = "#a9692e"; rr(VAT.cx - VAT.w / 2, VAT.top, VAT.w, VAT.h, 34); ctx.fill();
    ctx.fillStyle = "#8a4f1e"; ctx.beginPath(); ctx.ellipse(VAT.cx, VAT.top, VAT.w / 2, 16, 0, 0, Math.PI * 2); ctx.fill();
    if (waterLevel > 0.02) { ctx.fillStyle = "#5bb8e8";
      rr(VAT.cx - VAT.w / 2 + 8, surfaceY, VAT.w - 16, VAT.top + VAT.h - 12 - surfaceY, 18); ctx.fill(); }
    if (crack) { ctx.strokeStyle = "rgba(40,20,10,.8)"; ctx.lineWidth = 3; ctx.beginPath();
      ctx.moveTo(VAT.cx - 6, VAT.top + 30); ctx.lineTo(VAT.cx + 10, VAT.top + 70);
      ctx.lineTo(VAT.cx - 14, VAT.top + 110); ctx.lineTo(VAT.cx + 8, VAT.top + 150); ctx.stroke(); }

    const others = [{ x: 70, c: "#ef8a8a" }, { x: 120, c: "#8ab6ef" }, { x: 250, c: "#9ad49a" }];
    const othersArmUp = (t >= 9 && t < 19); const othersCheer = (t >= 24);
    others.forEach((k, i) => {
      const bob = (t < 5) || othersCheer;
      const px = k.x + (bob ? Math.sin(performance.now() / 200 + i) * 4 : 0);
      drawKid(px, 560, k.c, othersArmUp || othersCheer, bob);
    });

    drawKid(kidA.x, kidA.y, "#f0c14b", false, false);
    if (kidA.label) { ctx.fillStyle = "#222"; ctx.font = "11px sans-serif"; ctx.textAlign = "center"; ctx.fillText("落水孩童", kidA.x, kidA.y - 72); }

    const simaX = 300; drawKid(simaX, 560, "#c47bef", simaArmUp, false);
    ctx.fillStyle = "#222"; ctx.font = "11px sans-serif"; ctx.textAlign = "center"; ctx.fillText("司马光", simaX, 560 - 72);

    if (stone) { ctx.fillStyle = "#7d7d7d"; circle(stone.x, stone.y, 13); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.3)"; circle(stone.x - 4, stone.y - 4, 4); ctx.fill(); }

    particles.forEach(p => { ctx.globalAlpha = clamp(p.life, 0, 1); ctx.fillStyle = p.color; circle(p.x, p.y, 3); ctx.fill(); });
    ctx.globalAlpha = 1;

    narrationEl.textContent = phase.nar;
    subtitleEl.textContent = phase.sub;

    maybePlayNarration(idx);
  }

  // ---- 语音旁白（edge-tts 预生成，已 base64 内嵌）----

VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV"];
  let audioCtx = null, audioDest = null, audioEl = null, narrationOn = false, curPhase = -1;
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioDest = audioCtx.createMediaStreamDestination();
    audioEl = new Audio();
    const src = audioCtx.createMediaElementSource(audioEl);
    src.connect(audioDest);
    src.connect(audioCtx.destination);
  }
  function maybePlayNarration(idx) {
    if (idx === curPhase) return;
    curPhase = idx;
    if (narrationOn && audioCtx && NAR[idx]) {
      audioEl.src = NAR[idx]; audioEl.currentTime = 0; audioEl.play().catch(() => {});
    }
  }

  // ---- 导出视频（MediaRecorder，零依赖）----
  function exportVideo() {
    initAudio(); audioCtx.resume();
    narrationOn = true;
    const cvStream = cv.captureStream(30);
    const tracks = cvStream.getVideoTracks().slice();
    if (audioDest) { const at = audioDest.stream.getAudioTracks(); if (at.length) tracks.push(at[0]); }
    const ms = new MediaStream(tracks);
    let mime = "video/mp4";
    if (!MediaRecorder.isTypeSupported(mime)) mime = "video/webm";
    const rec = new MediaRecorder(ms, { mimeType: mime });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: mime });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = mime.indexOf("mp4") >= 0 ? "simaguang.mp4" : "simaguang.webm";
      a.click();
      setStatus("已导出：" + a.download);
    };
    rec.start();
    setStatus("录制中（约 " + DURATION + " 秒）…");
    setTimeout(() => rec.stop(), DURATION * 1000 + 300);
  }
  function setStatus(t) { statusEl.textContent = t; statusEl.style.opacity = "1"; }

  document.getElementById("btnNar").onclick = () => {
    initAudio(); audioCtx.resume();
    narrationOn = !narrationOn;
    document.getElementById("btnNar").textContent = narrationOn ? "🔊 语音旁白：开" : "🔇 语音旁白：关";
    if (!narrationOn && audioEl) audioEl.pause();
    if (narrationOn) setStatus("语音旁白已开启");
  };
  document.getElementById("btnExp").onclick = exportVideo;

  // ---- 主循环 ----
  let start = performance.now(), paused = false;
  function loop(now) {
    if (!paused) {
      const t = ((now - start) / 1000) % DURATION;
      updateState(t); updateParticles(); render(t);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  cv.addEventListener("click", () => {
    if (!paused) { paused = true; setStatus("已暂停 · 点击继续"); }
    else { paused = false; start = performance.now(); setStatus(""); }
  });
  setTimeout(() => { if (!paused) hintEl.style.opacity = "0"; }, 5000);
})();
